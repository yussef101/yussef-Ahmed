<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>初心者二人がフォートナイト サムネ</title>
<style>
  @font-face { font-family: "Dela Gothic One"; src: url("https://fonts.gstatic.com/s/delagothicone/v19/hESp6XxvMDRA-2eD0lXpDa6QkBAGRQ.ttf"); }
  @font-face { font-family: "M PLUS Rounded 1c"; font-weight: 900; src: url("https://fonts.gstatic.com/s/mplusrounded1c/v22/VdGBAYIAV6gnpUpoWwNkYvrugw9RuM0C45sK.ttf"); }
  html, body { margin: 0; padding: 0; background: #111; }
  svg { display: block; }
  .dela { font-family: "Dela Gothic One", sans-serif; }
  .round { font-family: "M PLUS Rounded 1c", sans-serif; font-weight: 900; }
</style>
</head>
<body>
<svg id="thumb" width="1280" height="720" viewBox="0 0 1280 720" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1e8bff"/>
      <stop offset="0.6" stop-color="#4fd0ff"/>
      <stop offset="1" stop-color="#b8f0ff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.22" cy="0.62" r="0.5">
      <stop offset="0" stop-color="#ffffff" stop-opacity="0.85"/>
      <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="storm" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#9b3dff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#8a2be2" stop-opacity="0.75"/>
      <stop offset="1" stop-color="#4b0f9e" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#fffb7a"/>
      <stop offset="0.5" stop-color="#ffe100"/>
      <stop offset="1" stop-color="#ff9d00"/>
    </linearGradient>
    <linearGradient id="red" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff6a6a"/>
      <stop offset="1" stop-color="#e8001c"/>
    </linearGradient>
    <linearGradient id="grass" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#7be35a"/>
      <stop offset="1" stop-color="#2f9e2f"/>
    </linearGradient>

    <!-- 初心者マーク (wakaba mark) -->
    <g id="wakaba">
      <path d="M -22 -24 L 0 -12 L 0 26 L -22 12 Z" fill="#ffe600" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
      <path d="M 22 -24 L 0 -12 L 0 26 L 22 12 Z" fill="#14a83b" stroke="#1a1a1a" stroke-width="3" stroke-linejoin="round"/>
    </g>
    <path id="drop" d="M 0 -26 C 10 -10 16 0 16 9 A 16 16 0 0 1 -16 9 C -16 0 -10 -10 0 -26 Z"/>
  </defs>

  <!-- sky + sunburst -->
  <rect width="1280" height="720" fill="url(#sky)"/>
  <g transform="translate(280 470)" fill="#ffffff" opacity="0.18">
    <path d="M0 0 L-1400 -260 L-1400 -60 Z"/>
    <path d="M0 0 L-1200 -900 L-900 -1100 Z"/>
    <path d="M0 0 L-350 -1200 L-60 -1200 Z"/>
    <path d="M0 0 L300 -1200 L620 -1200 Z"/>
    <path d="M0 0 L1000 -1100 L1300 -900 Z"/>
    <path d="M0 0 L1500 -500 L1500 -250 Z"/>
    <path d="M0 0 L1500 100 L1500 350 Z"/>
  </g>
  <rect width="1280" height="720" fill="url(#glow)"/>

  <!-- clouds -->
  <g fill="#ffffff" opacity="0.9">
    <ellipse cx="120" cy="90" rx="90" ry="30"/><ellipse cx="170" cy="70" rx="55" ry="35"/>
    <ellipse cx="560" cy="60" rx="70" ry="22"/><ellipse cx="600" cy="45" rx="40" ry="26"/>
  </g>

  <!-- storm wall on the right -->
  <path d="M 1280 0 L 900 0 C 1010 180 1020 420 920 720 L 1280 720 Z" fill="url(#storm)"/>
  <path d="M 1120 40 L 1080 150 L 1115 150 L 1070 270" fill="none" stroke="#f3d9ff" stroke-width="7" stroke-linejoin="round" stroke-linecap="round" opacity="0.9"/>
  <path d="M 1230 330 L 1195 420 L 1225 420 L 1185 520" fill="none" stroke="#f3d9ff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round" opacity="0.8"/>

  <!-- island -->
  <path d="M -20 610 C 150 560 330 575 520 600 C 700 625 850 600 1000 615 C 1120 625 1220 610 1300 620 L 1300 740 L -20 740 Z" fill="url(#grass)"/>
  <path d="M -20 610 C 150 560 330 575 520 600 C 700 625 850 600 1000 615 C 1120 625 1220 610 1300 620" fill="none" stroke="#b6ff8a" stroke-width="6" opacity="0.7"/>
  <g>
    <rect x="684" y="560" width="12" height="50" fill="#7a4a24"/><circle cx="690" cy="548" r="34" fill="#27a846"/><circle cx="676" cy="538" r="16" fill="#4fd06a"/>
  </g>

  <!-- ===== character A (orange, pickaxe) ===== -->
  <g transform="translate(160 470) rotate(-6)">
    <!-- legs -->
    <rect x="-42" y="120" width="34" height="70" rx="14" fill="#3b3b6b"/>
    <rect x="8" y="120" width="34" height="70" rx="14" fill="#3b3b6b"/>
    <ellipse cx="-27" cy="190" rx="26" ry="13" fill="#222"/><ellipse cx="27" cy="190" rx="26" ry="13" fill="#222"/>
    <!-- pickaxe in raised right hand -->
    <g transform="translate(98 -64) rotate(12)">
      <rect x="-8" y="-150" width="16" height="175" rx="7" fill="#8b5a2b" stroke="#2a1a0a" stroke-width="4"/>
      <path d="M -72 -128 C -42 -172 42 -172 72 -128 L 60 -118 C 30 -146 -30 -146 -60 -118 Z" fill="#c9d3dd" stroke="#2a2f36" stroke-width="5" stroke-linejoin="round"/>
    </g>
    <!-- arms up -->
    <path d="M -55 20 L -105 -60" stroke="#ff7a1a" stroke-width="34" stroke-linecap="round" fill="none"/>
    <path d="M 55 20 L 95 -55" stroke="#ff7a1a" stroke-width="34" stroke-linecap="round" fill="none"/>
    <circle cx="-108" cy="-68" r="20" fill="#ffd2a8" stroke="#2a1a0a" stroke-width="4"/>
    <circle cx="98" cy="-64" r="20" fill="#ffd2a8" stroke="#2a1a0a" stroke-width="4"/>
    <!-- hoodie body -->
    <path d="M -70 0 C -72 -20 72 -20 70 0 L 76 130 C 40 142 -40 142 -76 130 Z" fill="#ff7a1a" stroke="#2a1a0a" stroke-width="5" stroke-linejoin="round"/>
    <path d="M -30 80 L 30 80 L 26 112 L -26 112 Z" fill="#e8620a"/>
    <use href="#wakaba" transform="translate(-34 40) scale(0.85)"/>
    <!-- head -->
    <circle cx="0" cy="-70" r="82" fill="#ffd2a8" stroke="#2a1a0a" stroke-width="5"/>
    <path d="M -82 -82 C -80 -150 80 -165 84 -84 C 60 -110 30 -100 10 -118 C -10 -98 -50 -112 -82 -82 Z" fill="#5a3214" stroke="#2a1a0a" stroke-width="5" stroke-linejoin="round"/>
    <!-- shocked eyes -->
    <ellipse cx="-30" cy="-72" rx="22" ry="27" fill="#fff" stroke="#1a1a1a" stroke-width="5"/>
    <ellipse cx="30" cy="-72" rx="22" ry="27" fill="#fff" stroke="#1a1a1a" stroke-width="5"/>
    <circle cx="-28" cy="-70" r="7" fill="#1a1a1a"/><circle cx="28" cy="-70" r="7" fill="#1a1a1a"/>
    <path d="M -54 -112 L -12 -104" stroke="#2a1a0a" stroke-width="7" stroke-linecap="round"/>
    <path d="M 54 -112 L 12 -104" stroke="#2a1a0a" stroke-width="7" stroke-linecap="round"/>
    <ellipse cx="-56" cy="-34" rx="14" ry="8" fill="#ff8fa0" opacity="0.8"/><ellipse cx="56" cy="-34" rx="14" ry="8" fill="#ff8fa0" opacity="0.8"/>
    <!-- screaming mouth -->
    <ellipse cx="0" cy="-22" rx="22" ry="26" fill="#7a0d1a" stroke="#1a1a1a" stroke-width="5"/>
    <ellipse cx="0" cy="-10" rx="13" ry="9" fill="#ff5b6e"/>
    <!-- sweat -->
    <use href="#drop" transform="translate(94 -118) scale(1.1)" fill="#5ec8ff" stroke="#1a5a9a" stroke-width="3"/>
  </g>

  <!-- ===== character B (teal, confused) ===== -->
  <g transform="translate(410 495) rotate(5)">
    <rect x="-40" y="115" width="32" height="66" rx="14" fill="#2b2b2b"/>
    <rect x="8" y="115" width="32" height="66" rx="14" fill="#2b2b2b"/>
    <ellipse cx="-25" cy="180" rx="25" ry="12" fill="#f4f4f4" stroke="#222" stroke-width="3"/><ellipse cx="25" cy="180" rx="25" ry="12" fill="#f4f4f4" stroke="#222" stroke-width="3"/>
    <!-- arms: one scratching head, one out -->
    <path d="M -55 25 L -110 70" stroke="#13b8a6" stroke-width="32" stroke-linecap="round" fill="none"/>
    <circle cx="-114" cy="74" r="19" fill="#f2c193" stroke="#2a1a0a" stroke-width="4"/>
    <!-- game controller in hand -->
    <g transform="translate(-140 88) rotate(-20)">
      <path d="M -34 -14 C -20 -22 20 -22 34 -14 C 46 -6 48 22 36 26 C 26 30 20 16 12 14 L -12 14 C -20 16 -26 30 -36 26 C -48 22 -46 -6 -34 -14 Z" fill="#3d3d4a" stroke="#111" stroke-width="4"/>
      <circle cx="18" cy="-2" r="5" fill="#ff4d4d"/><circle cx="-18" cy="-2" r="6" fill="#999"/>
    </g>
    <path d="M -68 0 C -70 -20 70 -20 68 0 L 74 125 C 40 137 -40 137 -74 125 Z" fill="#13b8a6" stroke="#0a2a26" stroke-width="5" stroke-linejoin="round"/>
    <use href="#wakaba" transform="translate(32 40) scale(0.85)"/>
    <!-- head + beanie -->
    <circle cx="0" cy="-66" r="78" fill="#f2c193" stroke="#2a1a0a" stroke-width="5"/>
    <path d="M -80 -78 C -84 -160 84 -160 80 -78 Z" fill="#ff3b5c" stroke="#2a1a0a" stroke-width="5" stroke-linejoin="round"/>
    <rect x="-86" y="-92" width="172" height="26" rx="12" fill="#ffffff" stroke="#2a1a0a" stroke-width="5"/>
    <circle cx="0" cy="-152" r="16" fill="#ffffff" stroke="#2a1a0a" stroke-width="5"/>
    <!-- spiral confused eyes -->
    <g fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round">
      <path d="M -30 -46 m 0 0 a 4 4 0 1 1 6 -4 a 9 9 0 1 1 -14 -6 a 15 15 0 1 1 22 12"/>
      <path d="M 30 -46 m 0 0 a 4 4 0 1 0 -6 -4 a 9 9 0 1 0 14 -6 a 15 15 0 1 0 -22 12"/>
    </g>
    <ellipse cx="-54" cy="-20" rx="13" ry="7" fill="#ff8fa0" opacity="0.8"/><ellipse cx="54" cy="-20" rx="13" ry="7" fill="#ff8fa0" opacity="0.8"/>
    <!-- wobbly mouth -->
    <path d="M -22 -4 Q -11 -14 0 -4 Q 11 6 22 -4" fill="none" stroke="#1a1a1a" stroke-width="5" stroke-linecap="round"/>
    <path d="M 58 18 C 112 -6 108 -86 76 -118" stroke="#0a2a26" stroke-width="40" stroke-linecap="round" fill="none"/>
    <path d="M 58 18 C 112 -6 108 -86 76 -118" stroke="#13b8a6" stroke-width="31" stroke-linecap="round" fill="none"/>
    <circle cx="72" cy="-124" r="19" fill="#f2c193" stroke="#2a1a0a" stroke-width="4"/>
    <use href="#drop" transform="translate(-92 -100) scale(1)" fill="#5ec8ff" stroke="#1a5a9a" stroke-width="3"/>
  </g>

  <!-- ?! marks around the characters -->
  <g class="dela" font-size="86" text-anchor="middle" stroke-linejoin="round" paint-order="stroke">
    <text x="78" y="292" transform="rotate(-18 78 292)" fill="#ffe600" stroke="#1a1a1a" stroke-width="12">!?</text>
    <text x="530" y="330" transform="rotate(16 530 330)" fill="#ffffff" stroke="#1a1a1a" stroke-width="12">？</text>
  </g>

  <!-- beginner badge -->
  <g transform="translate(36 34) rotate(-4)">
    <rect width="292" height="74" rx="16" fill="#ffffff" stroke="#1a1a1a" stroke-width="6"/>
    <use href="#wakaba" transform="translate(48 38) scale(1.05)"/>
    <text x="178" y="53" class="round" font-size="42" text-anchor="middle" fill="#14a83b">初見プレイ</text>
  </g>

  <!-- hook tag -->
  <g transform="translate(985 612) rotate(-4)">
    <rect x="-238" y="-46" width="476" height="88" rx="14" fill="#1a1a1a" stroke="#ffffff" stroke-width="6"/>
    <text y="17" class="round" font-size="48" text-anchor="middle" fill="#ffe600">ビクロイいける…!?</text>
  </g>

  <!-- ===== main text ===== -->
  <g text-anchor="middle" stroke-linejoin="round" stroke-linecap="round">
    <!-- line 1 -->
    <g class="dela" font-size="92" transform="translate(880 175) rotate(-4)">
      <text stroke="#1a1a1a" stroke-width="30">初心者二人が</text>
      <text fill="#ffffff" stroke="#ffffff" stroke-width="2">初心者二人が</text>
    </g>
    <!-- line 2 -->
    <g class="dela" font-size="112" transform="translate(848 330) rotate(-4)">
      <text stroke="#ffffff" stroke-width="44">フォートナイト</text>
      <text stroke="#2a0a4a" stroke-width="26">フォートナイト</text>
      <text fill="url(#gold)">フォートナイト</text>
    </g>
    <!-- line 3 -->
    <g class="dela" font-size="98" transform="translate(860 485) rotate(-4)">
      <text stroke="#1a1a1a" stroke-width="40">やってみた！</text>
      <text stroke="#ffffff" stroke-width="20">やってみた！</text>
      <text fill="url(#red)">やってみた！</text>
    </g>
  </g>
</svg>
</body>
</html>
